spring.application.name=taskmanager

# 1. Server Port
server.port=${PORT:8080}

# 2. Smart Database Switching
# This line now automatically adds 'jdbc:' to whatever Railway gives us
spring.datasource.url=jdbc:${DATABASE_URL:h2:mem:taskdb}

# Switch driver based on environment
spring.datasource.driverClassName=${JDBC_DRIVER:org.h2.Driver}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}

# 3. H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 4. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Switch dialect dynamically so Postgres works on Railway
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# 5. Security Settings
spring.main.allow-bean-definition-overriding=true

# 6. JWT Configuration
app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwtExpirationMs=86400000