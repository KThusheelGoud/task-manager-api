spring.application.name=taskmanager

# 1. Server Port
server.port=${PORT:8080}

# 2. Smart Database Switching
# If on Railway, it uses DATABASE_URL. If on your laptop, it uses H2.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:taskdb}
spring.datasource.driverClassName=${JDBC_DRIVER:org.h2.Driver}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}

# 3. H2 Console (So you can see your data in a browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# 4. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# H2 Dialect for local, will be overridden by Railway for Postgres
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 5. Security Settings
spring.main.allow-bean-definition-overriding=true

# 6. JWT Configuration
app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwtExpirationMs=86400000